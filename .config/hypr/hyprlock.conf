# BACKGROUND
background {
    path = ~/.config/hypr/bg.png
    blur_passes = 3
    blur_size = 4
    noise = 0.008
    vibrancy = 0.35
    brightness = 0.60
}

general {
    no_fade_in = true
    hide_cursor = true
    ignore_empty_input = true
}

# Time
label {
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(234, 255, 255, 0.85)
    font_size = 120
    font_family = Source Sans Pro Light
    position = 0, 350
    halign = center
    valign = center
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 2, linear
}

image {
    path = ~/.config/icon.png
    border_size = 0
    size = 50, 100
    rounding = 100
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    size = 430, 60
    font_size = 90
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 217, 213, 0.65)
    inner_color = rgba(20, 27, 29, 0.75)
    font_color = rgb(216, 230, 234)
    check_color = rgb(122, 201, 67)
    fade_on_empty = false
    font_family = Source Sans Pro
    placeholder_text = <i><span foreground="##b4ebffaa">Enter the password</span></i>
    hide_input = false
    position = 0, -170
    halign = center
    valign = center
}
